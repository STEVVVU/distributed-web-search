name: Owned search scaling benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: node tools/test-search-build-config.mjs
      - run: node tools/benchmark-search.mjs --smoke
      - run: node tools/benchmark-search.mjs
      - run: node tools/benchmark-search.mjs --profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-benchmark-${{ github.sha }}
          path: .runs/benchmark-*/
          include-hidden-files: true
          retention-days: 14
