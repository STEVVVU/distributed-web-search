name: Owned search scaling benchmark
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [benchmark, profile]
        default: benchmark
        description: Full repeated matrix or separate failed-workload CPU profile
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1
        with:
          k6-version: '2.3.0'
          browser: false
      - run: k6 version
      - run: node tools/test-search-build-config.mjs
      - run: node tools/test-search-load-summary.mjs
      - run: node tools/benchmark-search.mjs --smoke
      - run: node tools/benchmark-search.mjs
        if: inputs.stage == 'benchmark'
      - run: node tools/benchmark-search.mjs --profile
        if: inputs.stage == 'profile'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-${{ inputs.stage }}-${{ github.sha }}
          path: .runs/benchmark-*/
          include-hidden-files: true
          retention-days: 14
