<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distributed Web Search</title>
<style>
:root{color-scheme:light;--ink:#172b35;--muted:#526873;--line:#c8d5d9;--accent:#075e64;--paper:#f4f7f5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:850px;margin:8vh auto;padding:0 24px}h1{font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.04em;margin:0}p{color:var(--muted)}form{display:flex;gap:10px;margin:32px 0 10px}input{flex:1;min-width:0;padding:14px;border:1px solid var(--line);border-radius:6px;font:inherit}button{padding:0 22px;border:0;border-radius:6px;background:var(--accent);color:white;font:inherit;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #d18435;outline-offset:2px}.status{font-size:.9rem}.result{padding:20px 0;border-top:1px solid var(--line)}.result h2{font-size:1.15rem;margin:0}.result a{color:var(--accent);overflow-wrap:anywhere}.meta{font-size:.83rem;color:var(--muted);margin:5px 0}.message{padding:24px 0;color:var(--muted)}@media(max-width:540px){main{margin:32px auto}form{flex-direction:column}button{padding:12px}}
</style>
<main>
  <p>LOCAL RESEARCH INDEX</p><h1>Search the web graph.</h1>
  <p>Pages are fetched from a bounded local fixture, indexed by distributed workers, and ranked with PageRank.</p>
  <form id="search"><label for="q" hidden>Search terms</label><input id="q" name="q" type="search" placeholder="Try distributed systems" required><button>Search</button></form>
  <p class="status" id="status" role="status">Checking index…</p><section id="results" aria-live="polite"></section>
</main>
<script>
const statusNode=document.querySelector('#status'),results=document.querySelector('#results');
async function status(){try{const s=await(await fetch('/api/status')).json();statusNode.textContent=s.ready?`Index ready · ${s.pages} pages · built ${new Date(s.createdAt).toLocaleString()}`:'Index not built yet. Run npm run index with the fixture active.'}catch{statusNode.textContent='Search service unavailable.'}}
document.querySelector('#search').addEventListener('submit',async e=>{e.preventDefault();results.replaceChildren();try{const data=await(await fetch(`/api/search?q=${encodeURIComponent(document.querySelector('#q').value)}`)).json();if(!data.results?.length){results.textContent='No matching pages.';return}for(const item of data.results){const article=document.createElement('article');article.className='result';article.innerHTML=`<h2></h2><a></a><p></p><p class="meta"></p>`;article.querySelector('h2').textContent=item.title||item.url;const link=article.querySelector('a');link.href=item.url;link.textContent=item.url;article.querySelector('p').textContent=item.snippet;article.querySelector('.meta').textContent=`score ${item.score.toFixed(5)} · lexical ${item.lexical.toFixed(3)} · PageRank ${item.rank.toFixed(5)}`;results.append(article)}}catch{results.textContent='Search failed. Check that the index is ready.'}});status();
</script>
