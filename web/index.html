<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distributed web search</title>
<style>
:root{color-scheme:dark;--paper:#181818;--ink:#ddd;--muted:#999;--link:#adc2fc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Arial,Helvetica,sans-serif}header{height:105px;border-bottom:1px solid #303030;position:relative;padding:21px 0 0 94px}.brand{position:absolute;left:27px;top:21px;width:40px;height:40px;border:1px solid #696969;border-radius:50%;display:grid;place-items:center;color:#ddd;font-size:19px;text-decoration:none;background:#333}form{display:flex;width:676px;max-width:calc(100vw - 120px);height:40px;border-radius:22px;background:#333;overflow:hidden}input{flex:1;min-width:0;padding:0 14px;border:0;background:transparent;color:#eee;font:700 14px Arial,Helvetica,sans-serif}button{width:44px;padding:9px 12px;border:0;background:transparent;color:#aaa;cursor:pointer}button svg{width:20px;height:20px;display:block}a{color:var(--link)}a:hover{text-decoration:underline}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:3px}input:focus-visible{outline-offset:-3px}.identity{margin:16px 0 0 16px;font-size:14px;font-weight:400;color:var(--link)}.toolbar{margin:11px 0 0 110px;max-width:calc(100vw - 134px);width:628px;display:flex;align-items:center;gap:10px;min-height:24px;color:#bbb;font-size:12px}.toolbar label{white-space:nowrap}select{font:inherit;max-width:220px;border:0;background:var(--paper);color:#ddd;padding:3px 18px 3px 0}.status{margin:0 0 0 auto;font-size:11px;color:var(--muted)}main{margin:18px 0 40px 110px;width:628px;max-width:calc(100vw - 134px)}.result{margin:0 0 34px}.source{display:flex;align-items:center;gap:8px;min-height:32px;font-size:13px;line-height:16px;color:#ddd}.source-mark{display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:50%;background:#303030;color:#aaa;font-size:16px}.source-url{color:#bbb;font-size:12px;overflow-wrap:anywhere}.result h2{font-size:22px;line-height:26.4px;font-weight:400;margin:15px 0 8px}.result h2 a{text-decoration:none}.result h2 a:hover{text-decoration:underline}.snippet{font-size:14px;line-height:20px;margin:0;color:#ddd}.meta{font-size:12px;line-height:18px;color:var(--muted);margin:8px 0 0}.message{font-size:14px;color:#ccc;padding:8px 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:800px){header{padding-left:70px}.brand{left:16px}form{max-width:calc(100vw - 86px)}.toolbar{margin-left:24px;max-width:calc(100vw - 48px);flex-wrap:wrap}.status{flex-basis:100%;margin-left:0}main{margin:18px 24px 40px;max-width:calc(100vw - 48px)}.result h2{font-size:21px}}
</style>
<header>
  <a class="brand" href="/" aria-label="Distributed web search home">D</a>
  <form id="search"><label for="q" class="sr-only">Search terms</label><input id="q" name="q" type="search" maxlength="512" placeholder="Search the local web graph" value="search" required><button aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg></button></form>
  <h1 class="identity">Distributed web search</h1>
</header>
<div class="toolbar"><label for="policy">Ranking policy</label><select id="policy" aria-describedby="policy-help"><option value="global">Global PageRank</option><option value="topic">Ranking research focus</option></select><span id="policy-help" class="sr-only">Research focus teleports to the ranking page. Compare the same query under both policies.</span><p class="status" id="status" role="status">Checking index…</p></div>
<main><section id="results" aria-live="polite" aria-label="Search results"></section></main>
<script>
const statusNode=document.querySelector('#status'),results=document.querySelector('#results');
let currentSearch=0;
async function json(url){const response=await fetch(url,{signal:AbortSignal.timeout(6000)});const data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
async function status(){try{const s=await json('/api/status');statusNode.textContent=s.ready?`Index ready · ${s.pages} pages`:'Index not built. Start npm run dev.'}catch{statusNode.textContent='Search service unavailable.'}}
async function search(){const request=++currentSearch;results.replaceChildren();try{const data=await json(`/api/search?q=${encodeURIComponent(document.querySelector('#q').value)}&policy=${document.querySelector('#policy').value}`);if(request!==currentSearch)return;if(!data.results.length){results.textContent='No matching pages.';return}for(const item of data.results){const article=document.createElement('article');article.className='result';article.innerHTML='<div class="source"><span class="source-mark" aria-hidden="true">↗</span><div><div class="source-name"></div><div class="source-url"></div></div></div><h2><a></a></h2><p class="snippet"></p><p class="meta"></p>';const url=new URL(item.url);article.querySelector('.source-name').textContent='Local research fixture';article.querySelector('.source-url').textContent=`${url.origin} › ${url.pathname==='/'?'home':url.pathname.slice(1)}`;const link=article.querySelector('a');link.href=item.url;link.textContent=item.title||item.url;article.querySelector('.snippet').textContent=item.snippet;article.querySelector('.meta').textContent=`score ${item.score.toFixed(5)} · lexical ${item.lexical.toFixed(3)} · PageRank ${item.rank.toFixed(5)}`;results.append(article)}}catch(error){if(request!==currentSearch)return;results.textContent=`Search unavailable: ${error.message}`}}
document.querySelector('#search').addEventListener('submit',e=>{e.preventDefault();search()});document.querySelector('#policy').addEventListener('change',search);status();search();
</script>
